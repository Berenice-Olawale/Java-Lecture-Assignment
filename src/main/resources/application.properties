spring.application.name=forex
server.error.include-message=always
spring.datasource.url=jdbc:h2:file:c:/data/notebook
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- OANDA (use your *practice* / demo account, never a live one) ---
oanda.base-url=https://api-fxpractice.oanda.com
oanda.token=PASTE-YOUR-PRACTICE-API-TOKEN-HERE
oanda.account-id=PASTE-YOUR-ACCOUNT-ID-HERE
