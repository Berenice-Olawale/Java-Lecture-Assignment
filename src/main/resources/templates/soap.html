<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('SOAP')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar('soap')}"></nav>

<main>

    <section class="container my-5">

        <div class="text-center mb-5">
            <h1 class="mb-3">SOAP – MNB Exchange Rates</h1>
            <p class="lead text-muted">
                Choose a currency and date range to view official exchange rates
                in HUF from the Hungarian National Bank.
            </p>
        </div>

        <div class="alert alert-danger"
             th:if="${error != null}"
             th:text="${error}">
        </div>

        <!-- Exchange rate form -->
        <div class="card shadow-sm mb-5">
            <div class="card-body p-4">

                <form th:action="@{/soap}"
                      th:object="${soapForm}"
                      method="post"
                      class="row g-3">

                    <div class="col-12 col-md-3">
                        <label for="currency" class="form-label">Currency</label>
                        <select id="currency" class="form-select" th:field="*{currency}">
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                            <option value="GBP">GBP</option>
                            <option value="CHF">CHF</option>
                            <option value="JPY">JPY</option>
                            <option value="CZK">CZK</option>
                            <option value="PLN">PLN</option>
                            <option value="RON">RON</option>
                            <option value="AUD">AUD</option>
                            <option value="CAD">CAD</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="startDate" class="form-label">Start date</label>
                        <input type="date" id="startDate" class="form-control" th:field="*{startDate}">
                    </div>

                    <div class="col-12 col-md-3">
                        <label for="endDate" class="form-label">End date</label>
                        <input type="date" id="endDate" class="form-control" th:field="*{endDate}">
                    </div>

                    <div class="col-12 col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Get rates</button>
                    </div>

                </form>

            </div>
        </div>

        <!-- No results -->
        <div class="alert alert-info" th:if="${rows != null and rows.isEmpty()}">
            No data was found for the selected period.
        </div>

        <!-- Results -->
        <div th:if="${rows != null and !rows.isEmpty()}">

            <h2 class="mb-4">Exchange Rates</h2>

            <div class="card shadow-sm mb-5">
                <div class="card-body">
                    <canvas id="rateChart" height="110"></canvas>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Unit</th>
                        <th>Rate (HUF)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${rows}">
                        <td th:text="${r.date}">2026-01-01</td>
                        <td th:text="${r.unit}">1</td>
                        <td th:text="${#numbers.formatDecimal(r.rate, 1, 'WHITESPACE', 2, 'POINT')}">0.00</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>

<!-- Chart.js (https://www.chartjs.org/) - only needed when there is data to draw -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script th:if="${rows != null and !rows.isEmpty()}" th:inline="javascript">
    const labels = /*[[${labels}]]*/ [];
    const values = /*[[${values}]]*/ [];
    const currency = /*[[${soapForm.currency}]]*/ 'EUR';

    new Chart(document.getElementById('rateChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: currency + ' / HUF',
                data: values,
                borderColor: '#1769aa',
                backgroundColor: 'rgba(23, 105, 170, 0.15)',
                fill: true,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            scales: {y: {title: {display: true, text: 'HUF'}}}
        }
    });
</script>
</body>
</html>
